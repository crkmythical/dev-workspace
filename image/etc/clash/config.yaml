mixed-port: 7890
socks-port: 7891
allow-lan: false
mode: rule
log-level: warning
external-controller: 127.0.0.1:9090

dns:
  enable: true
  listen: 0.0.0.0:53
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  nameserver:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query

# Base config — subscription fetch will overwrite this file with real proxies.
# This minimal config allows Clash to start even without a subscription.
proxies:
  - name: DIRECT-FALLBACK
    type: direct

proxy-groups:
  - name: auto-select
    type: select
    proxies:
      - DIRECT-FALLBACK

rules:
  - MATCH,auto-select
