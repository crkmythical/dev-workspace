# Desktop group — SELKIES stack (WebSocket + WebCodecs H.264).
# Provisioned at build time when DESKTOP_STACK includes selkies → copied to
# /etc/supervisor/conf.d/desktop.conf. Runs in parallel with the kasmvnc "vnc"
# group in "both" mode (selkies on :1/6080, kasmvnc on :2/6081).
# Core programs + optional audio, dependency
# order encoded by priority: Xvfb(100) → audio(120, optional) → selkies(150) →
# xfce(200). All autostart=false (on-demand).
# Stop order is the exact reverse (xfce first) for FUSE safety.
#
# Adaptive resolution: SELKIES_IS_MANUAL_RESOLUTION_MODE="false" lets the client
# drive the Xvfb resolution to match the browser window. This REQUIRES `cvt`
# (apt pkg `xcvt`, installed in image/Dockerfile) — selkies' reconfigure_displays
# calls cvt/gtf to synthesize a modeline for any non-preset size; without it the
# resize aborts (FATAL: Could not create extended mode ... Aborting). Do NOT
# re-pin this to manual mode without also reverting the xcvt dependency.

[group:desktop]
programs=desktop-xvfb,desktop-audio,desktop-selkies,desktop-xfce

[program:desktop-xvfb]
# Virtual canvas is a FIXED large size (4K), NOT DESKTOP_RESOLUTION. In adaptive
# mode the client drives the actual resolution via xrandr, but Xvfb's -screen
# size is the hard framebuffer CEILING: pixelflux captures via MIT-SHM and a
# resize REQUEST larger than this ceiling crashes selkies with X_ShmGetImage
# BadMatch (verified). 3840x2160 covers virtually all client windows; the
# client still downsizes within it. Framebuffer cost ~33MB. (DESKTOP_RESOLUTION
# still drives the kasmvnc/Xkasmvnc geometry in desktop-vnc.conf.)
command=/usr/bin/Xvfb :1 -screen 0 3840x2160x24 +extension COMPOSITE +extension DAMAGE +extension RANDR +extension GLX -nolisten tcp
autostart=false
autorestart=true
startsecs=2
priority=100
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:desktop-audio]
command=/usr/local/bin/start-audio.sh
autostart=false
autorestart=true
startsecs=2
priority=120
stdout_logfile=/dev/null
stdout_logfile_maxbytes=0
stderr_logfile=/dev/null
stderr_logfile_maxbytes=0

[program:desktop-selkies]
command=/opt/selkies-venv/bin/python -m selkies --addr=127.0.0.1 --mode=websockets --port=6080
environment=DISPLAY=":1",HOME="/workspace/.desktop",XDG_CONFIG_HOME="/workspace/.desktop/.config",XDG_DATA_HOME="/workspace/.desktop/.local/share",XDG_CACHE_HOME="/tmp/.desktop-cache",XDG_RUNTIME_DIR="/tmp/.desktop-cache",PULSE_SERVER="unix:/tmp/.desktop-cache/pulse/native",SELKIES_ENCODER="x264enc",SELKIES_FRAMERATE="30",SELKIES_IS_MANUAL_RESOLUTION_MODE="false"
autostart=false
autorestart=true
startsecs=3
priority=150
stdout_logfile=/dev/null
stdout_logfile_maxbytes=0
stderr_logfile=/dev/null
stderr_logfile_maxbytes=0

[program:desktop-xfce]
command=/usr/local/bin/start-xfce.sh
autostart=false
autorestart=true
startsecs=2
priority=200
stdout_logfile=/dev/null
stdout_logfile_maxbytes=0
stderr_logfile=/dev/null
stderr_logfile_maxbytes=0
