# Desktop group — SELKIES stack (WebSocket + WebCodecs H.264).
# Provisioned at build time when DESKTOP_STACK includes selkies → copied to
# /etc/supervisor/conf.d/desktop.conf. Runs in parallel with the kasmvnc "vnc"
# group in "both" mode (selkies on :1/6080, kasmvnc on :2/6081).
# Core programs + optional audio, dependency
# order encoded by priority: Xvfb(100) → audio(120, optional) → selkies(150) →
# xfce(200). All autostart=false (on-demand).
# Stop order is the exact reverse (xfce first) for FUSE safety.

[group:desktop]
programs=desktop-xvfb,desktop-audio,desktop-selkies,desktop-xfce

[program:desktop-xvfb]
command=/usr/bin/Xvfb :1 -screen 0 %(ENV_DESKTOP_RESOLUTION)sx24 +extension COMPOSITE +extension DAMAGE +extension RANDR +extension GLX -nolisten tcp
autostart=false
autorestart=true
startsecs=2
priority=100
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:desktop-audio]
command=/usr/local/bin/start-audio.sh
autostart=false
autorestart=true
startsecs=2
priority=120
stdout_logfile=/dev/null
stdout_logfile_maxbytes=0
stderr_logfile=/dev/null
stderr_logfile_maxbytes=0
stderr_logfile_maxbytes=0

[program:desktop-selkies]
command=/opt/selkies-venv/bin/python -m selkies --addr=127.0.0.1 --mode=websockets --port=6080
environment=DISPLAY=":1",HOME="/workspace/.desktop",XDG_CONFIG_HOME="/workspace/.desktop/.config",XDG_DATA_HOME="/workspace/.desktop/.local/share",XDG_CACHE_HOME="/tmp/.desktop-cache",XDG_RUNTIME_DIR="/tmp/.desktop-cache",PULSE_SERVER="unix:/tmp/.desktop-cache/pulse/native",SELKIES_ENCODER="x264enc",SELKIES_FRAMERATE="30",SELKIES_IS_MANUAL_RESOLUTION_MODE="true",SELKIES_MANUAL_WIDTH="1920",SELKIES_MANUAL_HEIGHT="1080"
autostart=false
autorestart=true
startsecs=3
priority=150
stdout_logfile=/dev/null
stdout_logfile_maxbytes=0
stderr_logfile=/dev/null
stderr_logfile_maxbytes=0

[program:desktop-xfce]
command=/usr/local/bin/start-xfce.sh
autostart=false
autorestart=true
startsecs=2
priority=200
stdout_logfile=/dev/null
stdout_logfile_maxbytes=0
stderr_logfile=/dev/null
stderr_logfile_maxbytes=0
