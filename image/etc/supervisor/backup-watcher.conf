# Realtime backup watcher — event-driven restic backup to S3.
# On-demand: started by entrypoint (auto) or unlock-vault (manual) when
# RESTIC_REPOSITORY is configured. Holds inotify watches on /workspace;
# MUST be stopped before fusermount -u (lock-vault/destroy do this).
#
# autorestart=false: does NOT auto-restart on crash. If it exits unexpectedly,
# doctor surfaces the problem; user fixes .env and manually restarts.

[program:backup-watcher]
command=/root/.bun/bin/bun run /opt/workspace/packages/cli/src/backup-watcher.ts
autostart=false
autorestart=false
startsecs=5
stopwaitsecs=10
stopsignal=TERM
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
