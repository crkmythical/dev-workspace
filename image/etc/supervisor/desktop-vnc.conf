# Desktop group — KASMVNC stack (integrated X server + WebSocket VNC).
# Provisioned at build time when DESKTOP_STACK includes kasmvnc → copied to
# /etc/supervisor/conf.d/vnc.conf. Runs in PARALLEL with the selkies group on an
# independent display (:2), independent HOME (/workspace/.desktop-vnc), and
# independent WS port (6081). Served by Caddy at /vnc/.
#
# Xkasmvnc is BOTH the X server and the WebSocket VNC server (no separate Xvfb).
#
# AUTH MODEL (verified working in Safari + Chrome — KasmVNC NATIVE auth):
#   -SecurityTypes None    → disable the RFB/VNC-protocol auth layer. REQUIRED:
#                            without it the client gets "No password configured
#                            for VNC Auth" and the connection is rejected.
#   (HTTP Basic Auth KEPT) → do NOT pass -DisableBasicAuth. KasmVNC's native HTTP
#                            Basic Auth gates the /websockify WebSocket upgrade
#                            ITSELF. The password lives at $HOME/.kasmpasswd
#                            (= /workspace/.desktop-vnc/.kasmpasswd), written by
#                            the entrypoint to the master password. Caddy does
#                            NOT add its own basic_auth for /vnc/ — browsers
#                            (Safari) won't replay Caddy creds to a JS WebSocket
#                            handshake, so KasmVNC MUST own auth end-to-end or the
#                            WS upgrades 101 then stalls at "Connecting...".
#                            Trade-off: KasmVNC's realm ("Websockify") differs
#                            from selkies' Caddy realm ("restricted"), so the
#                            browser prompts once more — same credentials.
#
# Start order (priority): xvnc(100) → xfce-vnc(200). All autostart=false
# (entrypoint flips to true on vault mount). Stop order is the exact reverse
# (xfce-vnc first) for FUSE safety — XFCE holds the HOME fd on the gocryptfs mount.

[group:vnc]
programs=desktop-xvnc,desktop-xfce-vnc

[program:desktop-xvnc]
command=/usr/bin/Xkasmvnc :2 -geometry %(ENV_DESKTOP_RESOLUTION)s -depth 24 -websocketPort 6081 -interface 127.0.0.1 -SecurityTypes None -AlwaysShared -FrameRate 30 -publicIP 127.0.0.1 -BlacklistThreshold 0 -httpd /usr/share/kasmvnc/www
environment=HOME="/workspace/.desktop-vnc",XDG_CONFIG_HOME="/workspace/.desktop-vnc/.config",XDG_DATA_HOME="/workspace/.desktop-vnc/.local/share",XDG_CACHE_HOME="/tmp/.desktop-cache"
autostart=false
autorestart=true
startsecs=2
priority=100
stdout_logfile=/dev/null
stdout_logfile_maxbytes=0
stderr_logfile=/dev/null
stderr_logfile_maxbytes=0

[program:desktop-xfce-vnc]
command=/usr/local/bin/start-xfce.sh
environment=DISPLAY=":2",HOME="/workspace/.desktop-vnc",XDG_CONFIG_HOME="/workspace/.desktop-vnc/.config",XDG_DATA_HOME="/workspace/.desktop-vnc/.local/share",XDG_CACHE_HOME="/tmp/.desktop-cache"
autostart=false
autorestart=true
startsecs=2
priority=200
stdout_logfile=/dev/null
stdout_logfile_maxbytes=0
stderr_logfile=/dev/null
stderr_logfile_maxbytes=0
