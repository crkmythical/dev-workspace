# KasmVNC configuration for dev-workspace remote desktop.
# Reference: https://kasmweb.com/kasmvnc/docs/master/configuration.html
# Reverse proxy: https://kasmweb.com/kasmvnc/docs/master/how_to/reverse_proxy.html
network:
  interface: 127.0.0.1
  websocket_port: 6080
  use_ipv4: true
  ssl:
    require_ssl: false
  udp:
    public_ip: 127.0.0.1

desktop:
  resolution:
    width: 1920
    height: 1080
  allow_resize: true

encoding:
  max_frame_rate: 30
  rect_encoding_mode:
    min_quality: 4
    max_quality: 9

runtime_configuration:
  allow_client_to_override_kasm_server_settings: true

security:
  brute_force_protection:
    blacklist_threshold: 0

logging:
  log_writer_name: all
  log_dest: logfile
  level: 30

command_line:
  prompt: false
