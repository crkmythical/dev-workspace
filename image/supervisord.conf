[supervisord]
nodaemon=true
user=root

[unix_http_server]
file=/var/run/supervisor.sock

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:caddy]
command=/usr/bin/caddy run --config /etc/caddy/Caddyfile
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:code-server]
command=code-server --bind-addr 127.0.0.1:8082 --user-data-dir /workspace/.code-server /workspace
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:sync-service]
command=bun run /opt/workspace/packages/server/src/index.ts
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:vault-sync-cron]
command=/usr/sbin/cron -f
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:clash-watcher]
command=/bin/bash -c "while true; do if ! pgrep -x clash > /dev/null 2>&1; then /usr/bin/clash -d /etc/clash & fi; sleep 5; done"
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

# --- Remote Desktop (on-demand, autostart=false) ---

[group:desktop]
programs=desktop-xvnc,desktop-openbox,desktop-tint2

[program:desktop-xvnc]
command=/usr/bin/Xkasmvnc :1 -geometry %(ENV_DESKTOP_RESOLUTION)s -depth 24 -websocketPort 6080 -interface 127.0.0.1 -SecurityTypes None -AlwaysShared -NeverShared=0 -FrameRate 30
environment=HOME="/workspace/.desktop",XDG_CONFIG_HOME="/workspace/.desktop/.config",XDG_DATA_HOME="/workspace/.desktop/.local/share",XDG_CACHE_HOME="/tmp/.desktop-cache"
autostart=false
autorestart=true
startsecs=2
priority=100
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:desktop-openbox]
command=/usr/bin/openbox --config-file /workspace/.desktop/.config/openbox/rc.xml
environment=DISPLAY=":1",HOME="/workspace/.desktop",XDG_CONFIG_HOME="/workspace/.desktop/.config",XDG_DATA_HOME="/workspace/.desktop/.local/share",XDG_CACHE_HOME="/tmp/.desktop-cache"
autostart=false
autorestart=true
startsecs=2
priority=200
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:desktop-tint2]
command=/usr/bin/tint2 -c /workspace/.desktop/.config/tint2/tint2rc
environment=DISPLAY=":1",HOME="/workspace/.desktop",XDG_CONFIG_HOME="/workspace/.desktop/.config",XDG_DATA_HOME="/workspace/.desktop/.local/share",XDG_CACHE_HOME="/tmp/.desktop-cache"
autostart=false
autorestart=true
startsecs=2
priority=200
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
