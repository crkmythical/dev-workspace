[supervisord]
nodaemon=true
user=root

[unix_http_server]
file=/var/run/supervisor.sock

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

# The desktop process group is provisioned per stack into conf.d/desktop.conf at
# image build time (DESKTOP_STACK=selkies|kasmvnc). It is NOT defined inline here
# so there is exactly one desktop topology in the image (no dead/duplicate group).
[include]
files = /etc/supervisor/conf.d/*.conf

[program:caddy]
command=/usr/bin/caddy run --config /etc/caddy/Caddyfile
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:code-server]
command=code-server --bind-addr 127.0.0.1:8082 --user-data-dir /workspace/.code-server /workspace
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/dev/null
stdout_logfile_maxbytes=0
stderr_logfile=/dev/null
stderr_logfile_maxbytes=0

[program:sync-service]
command=bun run /opt/workspace/packages/server/src/index.ts
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:vault-sync-cron]
command=/usr/sbin/cron -f
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:clash-watcher]
command=/bin/bash -c "while true; do if ! pgrep -x clash > /dev/null 2>&1; then /usr/bin/clash -d /etc/clash & fi; sleep 5; done"
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

# --- Remote Desktop ---
# The [group:desktop] and its programs are provided by the build-time-selected
# /etc/supervisor/conf.d/desktop.conf (see [include] above). One stack only.
