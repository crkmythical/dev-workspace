# Opt-in overlay: take the master password and the Clash subscription URL from FILES instead of the
# environment. Secrets in the environment are visible in `docker inspect`, in /proc/<pid>/environ of
# every process in the container, and in crash dumps; a file secret leaves only its path there.
#
#   make secrets-init      writes ./secrets/password and ./secrets/clash_subscription_url (0600)
#                          from the values in .env, never printing them
#   then delete PASSWORD= and CLASH_SUBSCRIPTION_URL= from .env and start with
#   COMPOSE_FILE=docker-compose.yml:docker-compose.secrets.yml
#   (append :docker-compose.apparmor.yml on a Linux or Colima host, as in .env.example)
#
# What this does NOT do, so it is not mistaken for more than it is:
#  * Compose mounts a file secret by bind-mounting the HOST file (it is not a tmpfs): ./secrets sits
#    on the host disk, 0600 and git-ignored. Keep it on an encrypted volume.
#  * The master password is still the vault passphrase. The entrypoint (root) reads it from the file
#    at start; the workspace user never sees it, and the login gate keeps only its bcrypt hash.
#  * Another secret goes the same way: add a `secrets:` entry, list it under the service, and set
#    <NAME>_FILE (names in .env.example, "SECRETS AS FILES"). Blank <NAME> here if .env sets it.
secrets:
  password:
    file: ./secrets/password
  clash_subscription_url:
    file: ./secrets/clash_subscription_url

services:
  workspace:
    secrets:
      - password
      - clash_subscription_url
    environment:
      # Blank what .env may still define (a non-empty <NAME> wins over <NAME>_FILE), then point at the files.
      PASSWORD: ""
      CLASH_SUBSCRIPTION_URL: ""
      PASSWORD_FILE: /run/secrets/password
      CLASH_SUBSCRIPTION_URL_FILE: /run/secrets/clash_subscription_url
