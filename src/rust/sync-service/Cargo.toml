[package]
name = "sync-service"
version = "0.1.0"
edition = "2021"
publish = false
description = "Rust/Axum sync-service — wire- and HTTP-compatible with the TS implementation it replaces"

[lib]
path = "src/lib.rs"

# Lib-only: the daemon runs as `sdw sync-service` (cli calls run_blocking), so there is no separate
# binary in the image. The integration tests here still exercise the lib directly.

[dependencies]
sdw-core = { path = "../core" }
# The file audit sink and the `<NAME>_FILE` secret reader (adapters over the real file system).
sdw-infra = { path = "../infra" }
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "process", "sync"] }
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22.1"
bcrypt = "0.15"
# Random per-boot session-signing key for the auth gateway (default mode). OS RNG only.
getrandom = "0.2"
# openat/mkdirat/renameat: the upload commit walks the shared tree one directory at a time without
# ever following a symlink (store.rs). Already in the build through tempfile; no new crate.
rustix = { version = "1", default-features = false, features = ["fs", "std"] }

[dev-dependencies]
# access_rotation.rs signs Access assertions with throwaway keys (the same crates core's tests use).
rsa = "0.9"
rand_core = { version = "0.6", features = ["getrandom"] }
hex = "0.4"
serde_json = "1"
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
