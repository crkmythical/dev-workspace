[package]
name = "sdw-infra"
version = "0.1.0"
edition = "2021"
publish = false
description = "Adapters that back the core ports with the container's real tools (gocryptfs/FUSE, Clash, restic, git, supervisord, croc)."

[lib]
path = "src/lib.rs"

[dependencies]
sdw-core = { path = "../core" }
hkdf = "0.13"
sha2 = "0.10"
base64 = "0.22.1"
serde_json = "1"
bcrypt = "0.15"
# Who am I (is_root): the commands behave differently for root and for the unprivileged workload.
rustix = { version = "1", default-features = false, features = ["process", "std"] }
zeroize = "1"

[dev-dependencies]
tempfile = "3"
