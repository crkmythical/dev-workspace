[package]
name = "sdw-web"
version = "0.1.0"
edition = "2021"
publish = false
description = "Rust/WebAssembly browser client for Secure Dev Workspace"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[target.'cfg(target_arch = "wasm32")'.dependencies]
sdw-core = { path = "../core" }
js-sys = "=0.3.107"
serde_json = "1"
sha2 = "0.10"
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "=0.4.80"
zeroize = "1"
gloo-timers = { version = "0.3", features = ["futures"] }
getrandom = { version = "0.2", features = ["js"] }
console_error_panic_hook = "0.1"
web-sys = { version = "=0.3.107", features = [
    "AbortController",
    "AbortSignal",
    "Blob",
    "Crypto",
    "Document",
    "Element",
    "Event",
    "EventTarget",
    "File",
    "Headers",
    "HtmlButtonElement",
    "HtmlCollection",
    "HtmlElement",
    "HtmlInputElement",
    "Location",
    "Node",
    "Request",
    "RequestInit",
    "Response",
    "Window",
] }
