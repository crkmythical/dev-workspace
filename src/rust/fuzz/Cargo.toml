# Coverage-guided fuzz targets (cargo-fuzz / libFuzzer). Detached from the main workspace via the
# empty [workspace] table below, because libfuzzer-sys needs a NIGHTLY toolchain the project does
# not otherwise use — so `cargo test --workspace` never tries to build this crate. The same two
# parsers are fuzzed continuously by proptest in the stable gate (core::sync::wire,
# core::sync::path_safety); these targets are for a deeper, coverage-guided campaign. See README.
[package]
name = "sdw-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
sdw-core = { path = "../core" }

[[bin]]
name = "parse_upload_body"
path = "fuzz_targets/parse_upload_body.rs"
test = false
doc = false
bench = false

[[bin]]
name = "check_relative_path"
path = "fuzz_targets/check_relative_path.rs"
test = false
doc = false
bench = false

[workspace]
