# Rust workspace for the Secure Dev Workspace: the `sdw` multi-call binary (cli) over pure domain
# logic (core) and tool adapters (infra), plus the tunnel-exposed sync daemon (sync-service, also
# run as `sdw sync-service`). This is the whole runtime; the image ships no Bun. See
# deploy/docs/rust-migration.md.
[workspace]
resolver = "2"
members = ["cli", "core", "infra", "sync-service"]

# One small, static binary is the point: optimise for size, strip, and abort on panic
# (no unwinding tables). Tests run under the dev profile, so this does not affect them.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# The sync key derivation does 600k PBKDF2-HMAC-SHA256 rounds. Unoptimised that is seconds per
# derive and would make `cargo test` crawl, so optimise just the crypto crates in the dev/test
# profile (everything else stays fast to compile).
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.pbkdf2]
opt-level = 3
[profile.dev.package.hmac]
opt-level = 3
