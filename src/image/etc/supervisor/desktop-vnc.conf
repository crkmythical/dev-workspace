# Desktop group — KASMVNC stack (integrated X server + WebSocket VNC).
# Provisioned at build time when DESKTOP_STACK includes kasmvnc → copied to
# /etc/supervisor/conf.d/vnc.conf. Runs in PARALLEL with the selkies group on an
# independent display (:2), independent HOME (/workspace/.desktop-vnc), and
# independent WS port (6081). Served by Caddy at /vnc/.
#
# Xkasmvnc is BOTH the X server and the WebSocket VNC server (no separate Xvfb).
#
# AUTH: none of its own. The session-cookie gate in front of Caddy is the login for /vnc/ and for
# the /websockify WebSocket alike (a same-origin cookie rides the handshake, which Basic Auth in
# a page cannot). KasmVNC's own HTTP Basic Auth is switched off (-DisableBasicAuth) and the RFB
# layer too (-SecurityTypes None, which it also needs: without it the client is told "No password
# configured for VNC Auth"): no password file, no second prompt, no copy of the master password in
# the desktop's home where the workload could read it.
#
# Runs as the unprivileged workload user (`sdw workload`), with its own HOME inside the vault.
#
# LOGS: each program writes (stdout and stderr together) to /var/log/desktop/<program>.log, capped
# at 2 MB with one backup. They used to go to /dev/null, which left a crashing X server or session
# with nothing to read; the container's own log would carry XFCE's chatter, so they get files.
#
# Start order (priority): xvnc(100) → xfce-vnc(200). All autostart=false
# (entrypoint flips to true on vault mount). Stop order is the exact reverse
# (xfce-vnc first) for FUSE safety — XFCE holds the HOME fd on the gocryptfs mount.
#
# stopasgroup/killasgroup: stopping a program must end its WHOLE process group. XFCE
# starts D-Bus-activated helpers (at-spi-bus-launcher, xfconfd, xfsettingsd, a session
# dbus-daemon) that outlive the launcher and keep files of the HOME (inside the vault)
# open, so without these two lines the mount stays busy after a "stopped" desktop and
# lock-vault cannot unmount cleanly (verified: the stop left 5 such processes behind).

[group:vnc]
programs=desktop-xvnc,desktop-xfce-vnc

[program:desktop-xvnc]
command=/usr/local/bin/sdw workload --home /workspace/.desktop-vnc -- /usr/bin/Xkasmvnc :2 -geometry %(ENV_DESKTOP_RESOLUTION)s -depth 24 -websocketPort 6081 -interface 127.0.0.1 -SecurityTypes None -DisableBasicAuth -AlwaysShared -FrameRate 30 -publicIP 127.0.0.1 -BlacklistThreshold 0 -httpd /usr/share/kasmvnc/www
environment=XDG_CONFIG_HOME="/workspace/.desktop-vnc/.config",XDG_DATA_HOME="/workspace/.desktop-vnc/.local/share",XDG_CACHE_HOME="/tmp/.desktop-cache"
autostart=false
stopasgroup=true
killasgroup=true
autorestart=true
startsecs=2
priority=100
stdout_logfile=/var/log/desktop/%(program_name)s.log
stdout_logfile_maxbytes=2MB
stdout_logfile_backups=1
redirect_stderr=true

[program:desktop-xfce-vnc]
command=/usr/local/bin/sdw workload --home /workspace/.desktop-vnc -- /usr/local/bin/start-xfce.sh
environment=DISPLAY=":2",XDG_CONFIG_HOME="/workspace/.desktop-vnc/.config",XDG_DATA_HOME="/workspace/.desktop-vnc/.local/share",XDG_CACHE_HOME="/tmp/.desktop-cache"
autostart=false
stopasgroup=true
killasgroup=true
autorestart=true
startsecs=2
priority=200
stdout_logfile=/var/log/desktop/%(program_name)s.log
stdout_logfile_maxbytes=2MB
stdout_logfile_backups=1
redirect_stderr=true
