# Desktop group — SELKIES stack (Selkies 2.x: WebSocket + WebCodecs H.264).
# Provisioned at build time when DESKTOP_STACK includes selkies → copied to
# /etc/supervisor/conf.d/desktop.conf. Runs in parallel with the kasmvnc "vnc"
# group in "both" mode (selkies on :1/6080, kasmvnc on :2/6081).
# Every program runs as the unprivileged workload user (`sdw workload`: clean environment, no
# secrets, HOME inside the vault).
# LOGS: Xvfb writes to the container's log; the others (stdout and stderr together) to
# /var/log/desktop/<program>.log, capped at 2 MB with one backup. They used to go to /dev/null,
# which left a crashing session or streamer with nothing to read.
# Core programs + optional audio, dependency
# order encoded by priority: Xvfb(100) → audio(120, optional) → selkies(150) →
# xfce(200). All autostart=false (on-demand).
# Stop order is the exact reverse (xfce first) for FUSE safety.
#
# stopasgroup/killasgroup: stopping a program must end its WHOLE process group. XFCE
# starts D-Bus-activated helpers (at-spi-bus-launcher, xfconfd, xfsettingsd, a session
# dbus-daemon) that outlive the launcher and keep files of the HOME (inside the vault)
# open, so without these two lines the mount stays busy after a "stopped" desktop.
#
# Adaptive resolution: Selkies is not run in manual-resolution mode (start-selkies.sh), so the
# client drives the Xvfb resolution to match the browser window. This uses RandR and, for a size
# that is not a preset, `cvt` (apt pkg `xcvt`, installed in image/Dockerfile) to synthesize a
# modeline; without it the resize can abort. Do NOT pin manual mode without also reverting the
# xcvt dependency.

[group:desktop]
programs=desktop-xvfb,desktop-audio,desktop-selkies,desktop-xfce

[program:desktop-xvfb]
# Virtual canvas is a FIXED large size (4K), NOT DESKTOP_RESOLUTION. In adaptive
# mode the client drives the actual resolution via xrandr, but Xvfb's -screen
# size is the hard framebuffer CEILING: pixelflux captures via MIT-SHM and a
# resize REQUEST larger than this ceiling crashes selkies with X_ShmGetImage
# BadMatch (verified with Selkies 1.x; kept for 2.x). 3840x2160 covers virtually all client windows; the
# client still downsizes within it. Framebuffer cost ~33MB. (DESKTOP_RESOLUTION
# still drives the kasmvnc/Xkasmvnc geometry in desktop-vnc.conf.)
command=/usr/local/bin/sdw workload --home /workspace/.desktop -- /usr/bin/Xvfb :1 -screen 0 3840x2160x24 +extension COMPOSITE +extension DAMAGE +extension RANDR +extension GLX -nolisten tcp
autostart=false
stopasgroup=true
killasgroup=true
autorestart=true
startsecs=2
priority=100
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

# DESKTOP_AUDIO unset (the default) → start-audio.sh exits 0 at once. Treat that as a clean,
# expected stop rather than a failed start, so supervisord does not retry it into FATAL (the
# "exited: desktop-audio (exit status 0; not expected)" noise). When audio IS enabled pulseaudio
# runs for the whole session; restart it only on an unexpected (non-zero) exit.
[program:desktop-audio]
command=/usr/local/bin/sdw workload --home /workspace/.desktop -- /usr/local/bin/start-audio.sh
autostart=false
stopasgroup=true
killasgroup=true
autorestart=unexpected
exitcodes=0
startsecs=0
priority=120
stdout_logfile=/var/log/desktop/%(program_name)s.log
stdout_logfile_maxbytes=2MB
stdout_logfile_backups=1
redirect_stderr=true

[program:desktop-selkies]
# The settings Selkies gets (loopback only, no login of its own, WebSocket transport, audio only
# with DESKTOP_AUDIO=1) are in start-selkies.sh, which ends in `exec python -m selkies ...`.
command=/usr/local/bin/sdw workload --home /workspace/.desktop -- /usr/local/bin/start-selkies.sh
environment=DISPLAY=":1",XDG_CONFIG_HOME="/workspace/.desktop/.config",XDG_DATA_HOME="/workspace/.desktop/.local/share",XDG_CACHE_HOME="/tmp/.desktop-cache",XDG_RUNTIME_DIR="/tmp/.desktop-cache",PULSE_SERVER="unix:/tmp/.desktop-cache/pulse/native"
autostart=false
stopasgroup=true
killasgroup=true
autorestart=true
startsecs=3
priority=150
stdout_logfile=/var/log/desktop/%(program_name)s.log
stdout_logfile_maxbytes=2MB
stdout_logfile_backups=1
redirect_stderr=true

[program:desktop-xfce]
command=/usr/local/bin/sdw workload --home /workspace/.desktop -- /usr/local/bin/start-xfce.sh
autostart=false
stopasgroup=true
killasgroup=true
autorestart=true
startsecs=2
priority=200
stdout_logfile=/var/log/desktop/%(program_name)s.log
stdout_logfile_maxbytes=2MB
stdout_logfile_backups=1
redirect_stderr=true
