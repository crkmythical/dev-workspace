# Optional browser editor. The image build installs this program definition only when
# EDITOR_SUITE=code-server; an editor-free image has no dead supervisor process.
[program:code-server]
command=/usr/local/bin/sdw workload -- /usr/bin/code-server --auth none --disable-update-check --disable-telemetry --bind-addr 127.0.0.1:8082 --user-data-dir /workspace/.code-server /workspace
autostart=true
autorestart=true
startretries=3
startsecs=3
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
