[supervisord]
nodaemon=true
user=root

[unix_http_server]
file=/var/run/supervisor.sock

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

# The desktop process group(s) are provisioned per stack into conf.d/*.conf at
# image build time (DESKTOP_STACK=both|selkies|kasmvnc). In "both" mode both the
# selkies group (desktop.conf) and the kasmvnc group (vnc.conf) are present and
# run in parallel. Not defined inline here so the topology has one source.
[include]
files = /etc/supervisor/conf.d/*.conf

# Caddy is the one program that faces the network, and it needs no privilege: it binds 8080, reads
# /etc/caddy and the static files, and keeps its own state under /var/lib/caddy. So it runs as the
# `caddy` user, and `env -i` keeps the container's environment (master password, subscription URL,
# backup keys) out of it: supervisord's `user=` switches the uid but leaves the environment as is.
[program:caddy]
command=/usr/bin/env -i PATH=/usr/bin:/bin HOME=/var/lib/caddy XDG_DATA_HOME=/var/lib/caddy/data XDG_CONFIG_HOME=/var/lib/caddy/config /usr/bin/caddy run --config /etc/caddy/Caddyfile
user=caddy
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

# code-server, and every terminal and tool started from it, runs as the unprivileged workload user:
# `sdw workload` gives privileges up and hands it a clean environment (none of the workspace's
# secrets). --auth none: the session gate in front of Caddy is the login, so code-server keeps no
# password of its own and no copy of the master password sits where the workload could read it.
# --disable-update-check / --disable-telemetry: this workspace runs fail-closed — when egress is down
# or the Clash subscription is empty, the firewall DROPs the workload user's traffic. code-server's
# startup update-check and telemetry calls then hang on the dropped SYNs until an internal ~75s
# timeout ("error timed out"), it exits, supervisord respawns it, and it thrashes — starving the box.
# Disabling those calls lets it start cleanly whether or not egress is up (and a security workspace
# should not phone home anyway). startretries caps any respawn storm instead of looping forever.
[program:code-server]
command=/usr/local/bin/sdw workload -- /usr/bin/code-server --auth none --disable-update-check --disable-telemetry --bind-addr 127.0.0.1:8082 --user-data-dir /workspace/.code-server /workspace
autostart=true
autorestart=true
startretries=3
startsecs=3
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:sync-service]
command=/usr/local/bin/sdw sync-service
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:vault-sync-cron]
command=/usr/sbin/cron -f
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

# clash-watcher starts Clash again if it dies, the same way the boot started it (the clash user, no
# extra groups) and only from a config the renderer wrote. See `sdw clash-watcher`.
[program:clash-watcher]
command=/usr/local/bin/sdw clash-watcher
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

# egress-monitor notices the egress path changing after boot (a node dies, Clash crashes, a
# subscription recovers): it rewrites /var/run/egress-status and writes an egress.change event to
# the audit trail. It reports; it blocks nothing. See `sdw egress-monitor`.
[program:egress-monitor]
command=/usr/local/bin/sdw egress-monitor
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

# --- Remote Desktop ---
# The [group:desktop] / [group:vnc] and their programs are provided by the
# build-time-selected /etc/supervisor/conf.d/*.conf (see [include] above).
