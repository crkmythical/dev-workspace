name: CI

on:
  push:
    branches: [main]
  pull_request:

# This workflow only reads the code and runs tests; it needs no write scopes. Without this block
# the job inherits the repo-default token, which is often read-write.
permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/rust
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          # Required when the action is pinned by SHA: it otherwise takes the toolchain from the ref
          # name (@stable), and a commit hash is not a toolchain.
          toolchain: stable
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src/rust

      - name: Rust-only product source
        working-directory: ${{ github.workspace }}
        run: test -z "$(git ls-files '*.ts' '*.tsx')"

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Browser WASM
        run: |
          cargo clippy -p sdw-web --target wasm32-unknown-unknown -- -D warnings
          cargo build --profile wasm --locked -p sdw-web --target wasm32-unknown-unknown
          VERSION="$(awk '$0 == "name = \"wasm-bindgen\"" { found=1; next } found && /^version = / { gsub(/[\" ]/, "", $3); print $3; exit }' Cargo.lock)"
          test -n "$VERSION"
          cargo install wasm-bindgen-cli --locked --version "$VERSION"
          wasm-bindgen target/wasm32-unknown-unknown/wasm/sdw_web.wasm \
            --target web --no-typescript --out-dir /tmp/sdw-web
          test ! -e /tmp/sdw-web/sdw_web.d.ts

      - name: Test
        run: cargo test --workspace --locked

  # Known vulnerabilities in every Rust dependency used by the native runtime, browser WASM and
  # native smoke client. The policy, with a reason for each ignored advisory, is audit.toml.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2

      - name: cargo audit
        working-directory: src/rust
        run: cargo audit

  # Shell scripts (shellcheck is preinstalled on the runner) and the rule that no secrets file is
  # ever tracked: .env holds the master password, which is also the vault passphrase.
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: No secrets file is tracked
        run: deploy/scripts/check-tracked-secrets.sh
      - name: shellcheck
        run: make lint-sh
      # The host scripts that handle secrets or delete things, against fakes (no Docker needed).
      - name: Script tests
        run: |
          bash src/tests/scripts/orchestration-lib.test.sh
          bash src/tests/scripts/destroy.test.sh
          bash src/tests/scripts/secrets-guard.test.sh
