name: Build & Push Dev Workspace Image

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      desktop_stack:
        description: 'Desktop stack (both/selkies/kasmvnc)'
        type: choice
        options: [both, selkies, kasmvnc]
        default: 'both'

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/dev-workspace
  DOCKERHUB_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/dev-workspace
  DESKTOP_STACK: ${{ inputs.desktop_stack || 'both' }}

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android \
            /opt/ghc /usr/local/share/boost /opt/hostedtoolcache
          sudo apt-get clean
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine registries
        id: registries
        run: |
          IMAGES="${{ env.GHCR_IMAGE }}"
          if [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            IMAGES="${IMAGES},${{ env.DOCKERHUB_IMAGE }}"
          fi
          echo "images=${IMAGES}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: ${{ secrets.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (per-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: image/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ${{ env.GHCR_IMAGE }}:${{ github.sha }}-${{ matrix.arch }}
          build-args: |
            BASE_IMAGE=kalilinux/kali-rolling
            DESKTOP_STACK=${{ env.DESKTOP_STACK }}
          cache-from: type=registry,ref=${{ env.GHCR_IMAGE }}:cache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.GHCR_IMAGE }}:cache-${{ matrix.arch }},mode=max

  manifest:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: ${{ secrets.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine tags
        id: tags
        run: |
          SHA="${{ github.sha }}"
          REF_NAME="${{ github.ref_name }}"

          # GHCR tags
          GHCR_TAGS="${{ env.GHCR_IMAGE }}:${REF_NAME},${{ env.GHCR_IMAGE }}:latest"

          # Docker Hub tags (if configured)
          DH_TAGS=""
          if [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            DH_TAGS="${{ env.DOCKERHUB_IMAGE }}:${REF_NAME},${{ env.DOCKERHUB_IMAGE }}:latest"
          fi

          echo "ghcr_tags=${GHCR_TAGS}" >> "$GITHUB_OUTPUT"
          echo "dh_tags=${DH_TAGS}" >> "$GITHUB_OUTPUT"

      - name: Create and push multi-arch manifest (GHCR)
        run: |
          IFS=',' read -ra TAGS <<< "${{ steps.tags.outputs.ghcr_tags }}"
          for TAG in "${TAGS[@]}"; do
            docker buildx imagetools create -t "${TAG}" \
              "${{ env.GHCR_IMAGE }}:${{ github.sha }}-amd64" \
              "${{ env.GHCR_IMAGE }}:${{ github.sha }}-arm64"
          done

      - name: Create and push multi-arch manifest (Docker Hub)
        if: ${{ secrets.DOCKERHUB_TOKEN != '' }}
        run: |
          IFS=',' read -ra TAGS <<< "${{ steps.tags.outputs.dh_tags }}"
          for TAG in "${TAGS[@]}"; do
            docker buildx imagetools create -t "${TAG}" \
              "${{ env.GHCR_IMAGE }}:${{ github.sha }}-amd64" \
              "${{ env.GHCR_IMAGE }}:${{ github.sha }}-arm64"
          done
