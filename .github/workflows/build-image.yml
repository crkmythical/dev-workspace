name: Build, verify & publish Dev Workspace

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/dev-workspace
  DOCKERHUB_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/dev-workspace

permissions:
  contents: read

jobs:
  # Build each publishable architecture once. The immutable GHCR candidate is then pulled and
  # smoked on a native runner; release manifests are created only after all four exact candidates
  # pass. Candidate tags may remain after a failed run, but no user-facing tag points at them.
  build-and-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { variant: default, stack: kasmvnc, runner: ubuntu-latest, platform: linux/amd64, arch: amd64 }
          - { variant: default, stack: kasmvnc, runner: ubuntu-24.04-arm, platform: linux/arm64, arch: arm64 }
          - { variant: full, stack: both, runner: ubuntu-latest, platform: linux/amd64, arch: amd64 }
          - { variant: full, stack: both, runner: ubuntu-24.04-arm, platform: linux/arm64, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android \
            /opt/ghc /usr/local/share/boost /opt/hostedtoolcache
          sudo apt-get clean
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build immutable candidate
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./src
          file: ./src/image/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.GHCR_IMAGE }}:${{ github.sha }}-${{ matrix.variant }}-${{ matrix.arch }}
          build-args: |
            BASE_IMAGE=kalilinux/kali-rolling
            DESKTOP_STACK=${{ matrix.stack }}
          provenance: mode=max
          sbom: true
          cache-from: type=registry,ref=${{ env.GHCR_IMAGE }}:cache-${{ matrix.variant }}-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.GHCR_IMAGE }}:cache-${{ matrix.variant }}-${{ matrix.arch }},mode=max

      - name: Smoke exact candidate
        uses: ./.github/actions/run-smoke
        with:
          image: ${{ env.GHCR_IMAGE }}:${{ github.sha }}-${{ matrix.variant }}-${{ matrix.arch }}
          pull: 'true'
          require-browser: 'true'
          artifact-name: release-smoke-${{ matrix.variant }}-${{ matrix.arch }}

  host-binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, asset: linux-amd64 }
          - { runner: ubuntu-24.04-arm, asset: linux-arm64 }
          - { runner: macos-15-intel, asset: darwin-amd64 }
          - { runner: macos-15, asset: darwin-arm64 }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src/rust
      - name: Build and package sdw-host
        working-directory: src/rust
        run: |
          cargo build --release --locked -p sdw-host
          target/release/sdw-host --help
          mkdir -p host-dist
          archive="sdw-host-${{ matrix.asset }}.tar.gz"
          COPYFILE_DISABLE=1 tar -czf "host-dist/$archive" -C target/release sdw-host
          (cd host-dist && if command -v sha256sum >/dev/null 2>&1; then sha256sum "$archive"; else shasum -a 256 "$archive"; fi > "$archive.sha256")
      - name: Upload host binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdw-host-${{ matrix.asset }}
          path: src/rust/host-dist/*
          if-no-files-found: error

  manifest:
    needs: build-and-smoke
    strategy:
      matrix:
        include:
          - { variant: default, suffix: '' }
          - { variant: full, suffix: '-full' }
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish verified multi-arch manifests
        run: |
          REF_NAME="${{ github.ref_name }}"
          SUFFIX="${{ matrix.suffix }}"
          SOURCES=(
            "${GHCR_IMAGE}:${GITHUB_SHA}-${{ matrix.variant }}-amd64"
            "${GHCR_IMAGE}:${GITHUB_SHA}-${{ matrix.variant }}-arm64"
          )
          TAGS=("${GHCR_IMAGE}:${REF_NAME}${SUFFIX}" "${GHCR_IMAGE}:latest${SUFFIX}")
          if [ "$HAS_DOCKERHUB" = "true" ]; then
            TAGS+=("${DOCKERHUB_IMAGE}:${REF_NAME}${SUFFIX}" "${DOCKERHUB_IMAGE}:latest${SUFFIX}")
          fi
          for tag in "${TAGS[@]}"; do
            docker buildx imagetools create -t "$tag" "${SOURCES[@]}"
          done

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-and-smoke, host-binaries, manifest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download host binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sdw-host-*
          path: host-dist
          merge-multiple: true

      - name: Assemble checksums
        run: |
          platforms=(linux-amd64 linux-arm64 darwin-amd64 darwin-arm64)
          test "$(find host-dist -type f | wc -l)" -eq 8
          for platform in "${platforms[@]}"; do
            archive="sdw-host-${platform}.tar.gz"
            test -f "host-dist/$archive"
            test -f "host-dist/$archive.sha256"
            (cd host-dist && sha256sum --check "$archive.sha256")
          done
          cat host-dist/sdw-host-{linux-amd64,linux-arm64,darwin-amd64,darwin-arm64}.tar.gz.sha256 \
            | sort > host-dist/SHA256SUMS
          test "$(wc -l < host-dist/SHA256SUMS)" -eq 4
          test "$(find host-dist -type f | wc -l)" -eq 9

      - name: Publish GitHub release after every gate passes
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" --json isDraft >/tmp/release.json 2>/dev/null; then
            if [ "$(jq -r .isDraft /tmp/release.json)" != true ]; then
              echo "release $tag is already published; refusing to replace its assets" >&2
              exit 1
            fi
            gh release delete "$tag" --yes
          fi
          gh release create "$tag" --verify-tag --draft --generate-notes --title "$tag" host-dist/*
          count="$(gh release view "$tag" --json assets --jq '.assets | length')"
          test "$count" -eq 9
          gh release edit "$tag" --draft=false --latest
