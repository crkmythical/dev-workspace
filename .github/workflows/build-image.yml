name: Build & Push Dev Workspace Image
on:
  push:
    tags: ['v*']
  workflow_dispatch:
env:
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/dev-workspace
  DOCKERHUB_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/dev-workspace
permissions:
  contents: read
jobs:
  # Nothing is published unless the image boots and passes the smoke suite (src/tests/smoke).
  smoke-default:
    uses: ./.github/workflows/smoke.yml
    with:
      variant: default
    permissions:
      contents: read
  smoke-full:
    uses: ./.github/workflows/smoke.yml
    with:
      variant: full
    permissions:
      contents: read
  build:
    needs: [smoke-default, smoke-full]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Default image: KasmVNC desktop only (/vnc/). Small and quick to build.
          - { variant: default, stack: kasmvnc, runner: ubuntu-latest, platform: linux/amd64, arch: amd64 }
          - { variant: default, stack: kasmvnc, runner: ubuntu-24.04-arm, platform: linux/arm64, arch: arm64 }
          # Full image (tag suffix -full): Selkies (/desktop/) AND KasmVNC. Built on every
          # release so the Selkies path is exercised and cannot rot unnoticed.
          - { variant: full, stack: both, runner: ubuntu-latest, platform: linux/amd64, arch: amd64 }
          - { variant: full, stack: both, runner: ubuntu-24.04-arm, platform: linux/arm64, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      # `secrets` is not available in step-level `if`, so it is mapped here first.
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android \
            /opt/ghc /usr/local/share/boost /opt/hostedtoolcache
          sudo apt-get clean
          df -h /
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub
        if: env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push (per-arch)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./src
          file: ./src/image/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ${{ env.GHCR_IMAGE }}:${{ github.sha }}-${{ matrix.variant }}-${{ matrix.arch }}
          build-args: |
            BASE_IMAGE=kalilinux/kali-rolling
            DESKTOP_STACK=${{ matrix.stack }}
          # What went into the image and how it was built, attached to it as attestations.
          provenance: mode=max
          sbom: true
          cache-from: type=registry,ref=${{ env.GHCR_IMAGE }}:cache-${{ matrix.variant }}-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.GHCR_IMAGE }}:cache-${{ matrix.variant }}-${{ matrix.arch }},mode=max
  manifest:
    needs: build
    strategy:
      matrix:
        include:
          - { variant: default, suffix: '' }
          - { variant: full, suffix: '-full' }
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub
        if: env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Create and push multi-arch manifests
        run: |
          REF_NAME="${{ github.ref_name }}"
          SUFFIX="${{ matrix.suffix }}"
          SOURCES=(
            "${{ env.GHCR_IMAGE }}:${{ github.sha }}-${{ matrix.variant }}-amd64"
            "${{ env.GHCR_IMAGE }}:${{ github.sha }}-${{ matrix.variant }}-arm64"
          )
          TAGS=("${{ env.GHCR_IMAGE }}:${REF_NAME}${SUFFIX}" "${{ env.GHCR_IMAGE }}:latest${SUFFIX}")
          # Docker Hub copies, when configured.
          if [ "$HAS_DOCKERHUB" = "true" ]; then
            TAGS+=("${{ env.DOCKERHUB_IMAGE }}:${REF_NAME}${SUFFIX}" "${{ env.DOCKERHUB_IMAGE }}:latest${SUFFIX}")
          fi
          for TAG in "${TAGS[@]}"; do
            docker buildx imagetools create -t "${TAG}" "${SOURCES[@]}"
          done
