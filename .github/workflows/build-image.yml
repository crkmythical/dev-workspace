name: 共享镜像构建（内部）

on:
  workflow_call:
    inputs:
      base:
        description: Base profile key from src/image/profiles.json
        type: string
        required: true
      desktop:
        description: Desktop suite
        type: string
        required: true
      editor:
        description: Browser editor suite
        type: string
        required: true
      dev_runtimes:
        description: Preinstalled development runtimes
        type: string
        required: true
      desktop_apps:
        description: Preinstalled desktop applications
        type: string
        required: true
      pentest:
        description: Pentest bootstrap support
        type: string
        required: true
      backup_transfer:
        description: Backup and transfer tools
        type: string
        required: true
      case_id:
        description: Optional unique suffix for coverage-matrix cases
        type: string
        default: ''
      upload_artifact:
        description: Upload the validated archive instead of discarding the test copy
        type: boolean
        default: true

# This shared workflow is read-only. The Kali entry owns the separate tag-only Release job;
# manual Debian and Alpine builds finish as two short-lived Actions artifacts.
permissions:
  contents: read

env:
  # docker/build-push-action otherwise uploads one opaque *.dockerbuild artifact per architecture.
  DOCKER_BUILD_RECORD_UPLOAD: 'false'

jobs:
  validate:
    name: 检查所选配置
    runs-on: ubuntu-latest
    outputs:
      base_image: ${{ steps.profile.outputs.base_image }}
      image_name: ${{ steps.profile.outputs.image_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the association list
        id: profile
        shell: bash
        env:
          BASE: ${{ inputs.base }}
          DESKTOP: ${{ inputs.desktop }}
          EDITOR: ${{ inputs.editor }}
          DEV_RUNTIMES: ${{ inputs.dev_runtimes }}
          DESKTOP_APPS: ${{ inputs.desktop_apps }}
          PENTEST: ${{ inputs.pentest }}
          BACKUP_TRANSFER: ${{ inputs.backup_transfer }}
          CASE_ID: ${{ inputs.case_id }}
        run: |
          set -euo pipefail
          profiles=src/image/profiles.json
          if [[ -n "$CASE_ID" && ! "$CASE_ID" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
            echo "Invalid matrix case id: $CASE_ID" >&2
            exit 2
          fi
          jq -e --arg base "$BASE" '.bases[$base] != null' "$profiles" >/dev/null \
            || { echo "Unknown base profile: $BASE" >&2; exit 2; }

          allowed() {
            local key="$1" value="$2"
            if ! jq -e --arg base "$BASE" --arg key "$key" --arg value "$value" \
              '.bases[$base][$key] | index($value) != null' "$profiles" >/dev/null; then
              local choices
              choices="$(jq -r --arg base "$BASE" --arg key "$key" \
                '.bases[$base][$key] | join(", ")' "$profiles")"
              echo "$BASE does not support $key=$value; choose one of: $choices" >&2
              exit 2
            fi
          }

          allowed desktop "$DESKTOP"
          allowed editor "$EDITOR"
          allowed dev_runtimes "$DEV_RUNTIMES"
          allowed desktop_apps "$DESKTOP_APPS"
          allowed pentest "$PENTEST"
          allowed backup_transfer "$BACKUP_TRANSFER"

          base_image="$(jq -r --arg base "$BASE" '.bases[$base].image' "$profiles")"
          selected="${DESKTOP}|${EDITOR}|${DEV_RUNTIMES}|${DESKTOP_APPS}|${PENTEST}|${BACKUP_TRANSFER}"
          defaults="$(jq -r --arg base "$BASE" \
            '.bases[$base].defaults | [.desktop, .editor, .dev_runtimes, .desktop_apps, .pentest, .backup_transfer] | join("|")' \
            "$profiles")"
          if [ -n "$CASE_ID" ]; then
            image_name="dev-workspace-${BASE}-${DESKTOP}-${CASE_ID}"
          elif [ "$selected" = "$defaults" ]; then
            image_name="dev-workspace-${BASE}-${DESKTOP}"
          else
            image_name="dev-workspace-${BASE}-${DESKTOP}-editor-${EDITOR}-runtimes-${DEV_RUNTIMES}-apps-${DESKTOP_APPS}-pentest-${PENTEST}-transfer-${BACKUP_TRANSFER}"
          fi
          echo "base_image=$base_image" >> "$GITHUB_OUTPUT"
          echo "image_name=$image_name" >> "$GITHUB_OUTPUT"
          {
            echo '### Image profile'
            echo
            echo '| Setting | Selection |'
            echo '|---|---|'
            if [ -n "$CASE_ID" ]; then echo "| Matrix case | \`$CASE_ID\` |"; fi
            echo "| Package prefix | \`$image_name\` |"
            echo "| Base | \`$BASE\` (\`$base_image\`) |"
            echo "| Desktop | \`$DESKTOP\` |"
            echo "| Editor | \`$EDITOR\` |"
            echo "| Dev runtimes | \`$DEV_RUNTIMES\` |"
            echo "| Desktop apps | \`$DESKTOP_APPS\` |"
            echo "| Pentest | \`$PENTEST\` |"
            echo "| Backup/transfer | \`$BACKUP_TRANSFER\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: 构建 ${{ matrix.arch }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android \
            /opt/ghc /usr/local/share/boost /opt/hostedtoolcache
          sudo apt-get clean

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build selected image once
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./src
          file: ./src/image/Dockerfile
          platforms: ${{ matrix.platform }}
          load: true
          tags: ${{ needs.validate.outputs.image_name }}
          labels: |
            io.sdw.base-profile=${{ inputs.base }}
            io.sdw.desktop-suite=${{ inputs.desktop }}
            io.sdw.editor-suite=${{ inputs.editor }}
            io.sdw.dev-runtimes=${{ inputs.dev_runtimes }}
            io.sdw.desktop-apps=${{ inputs.desktop_apps }}
            io.sdw.pentest-suite=${{ inputs.pentest }}
            io.sdw.backup-transfer=${{ inputs.backup_transfer }}
          build-args: |
            BASE_IMAGE=${{ needs.validate.outputs.base_image }}
            BASE_PROFILE=${{ inputs.base }}
            DESKTOP_STACK=${{ inputs.desktop }}
            EDITOR_SUITE=${{ inputs.editor }}
            DEV_RUNTIMES=${{ inputs.dev_runtimes }}
            DESKTOP_APPS=${{ inputs.desktop_apps }}
            PENTEST_SUITE=${{ inputs.pentest }}
            BACKUP_TRANSFER=${{ inputs.backup_transfer }}
            APT_MIRROR=deb.debian.org
            KALI_MIRROR=http.kali.org
          provenance: false
          sbom: false
          cache-from: type=gha,scope=image-${{ inputs.base }}-${{ inputs.desktop }}-${{ inputs.editor }}-${{ inputs.dev_runtimes }}-${{ inputs.desktop_apps }}-${{ inputs.pentest }}-${{ inputs.backup_transfer }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=image-${{ inputs.base }}-${{ inputs.desktop }}-${{ inputs.editor }}-${{ inputs.dev_runtimes }}-${{ inputs.desktop_apps }}-${{ inputs.pentest }}-${{ inputs.backup_transfer }}-${{ matrix.arch }}

      - name: Verify architecture and selected contents
        shell: bash
        env:
          IMAGE: ${{ needs.validate.outputs.image_name }}
          EXPECT_ARCH: ${{ matrix.arch }}
          EXPECT_BASE: ${{ inputs.base }}
          EXPECT_DESKTOP: ${{ inputs.desktop }}
          EXPECT_EDITOR: ${{ inputs.editor }}
          EXPECT_DEV_RUNTIMES: ${{ inputs.dev_runtimes }}
          EXPECT_DESKTOP_APPS: ${{ inputs.desktop_apps }}
          EXPECT_PENTEST: ${{ inputs.pentest }}
          EXPECT_BACKUP_TRANSFER: ${{ inputs.backup_transfer }}
        run: |
          set -euo pipefail
          actual_arch="$(docker image inspect --format '{{.Architecture}}' "$IMAGE")"
          test "$actual_arch" = "$EXPECT_ARCH"
          docker run --rm --entrypoint /bin/sh \
            -e EXPECT_BASE -e EXPECT_DESKTOP -e EXPECT_EDITOR -e EXPECT_DEV_RUNTIMES \
            -e EXPECT_DESKTOP_APPS -e EXPECT_PENTEST -e EXPECT_BACKUP_TRANSFER \
            "$IMAGE" -ec '
              . /etc/os-release
              test "$ID" = "$EXPECT_BASE"
              test "$(jq -r .base /etc/sdw-build.json)" = "$EXPECT_BASE"
              test "$(jq -r .desktop /etc/sdw-build.json)" = "$EXPECT_DESKTOP"
              test "$(jq -r .editor /etc/sdw-build.json)" = "$EXPECT_EDITOR"
              test "$(jq -r .dev_runtimes /etc/sdw-build.json)" = "$EXPECT_DEV_RUNTIMES"
              test "$(jq -r .desktop_apps /etc/sdw-build.json)" = "$EXPECT_DESKTOP_APPS"
              test "$(jq -r .pentest /etc/sdw-build.json)" = "$EXPECT_PENTEST"
              test "$(jq -r .backup_transfer /etc/sdw-build.json)" = "$EXPECT_BACKUP_TRANSFER"
              test "$(cat /etc/sdw-desktop-stack)" = "$EXPECT_DESKTOP"
              test "$(cat /etc/sdw-editor-suite)" = "$EXPECT_EDITOR"
              command -v sdw >/dev/null
              command -v caddy >/dev/null
              command -v supervisord >/dev/null
              caddy validate --config /etc/caddy/Caddyfile >/dev/null

              case "$EXPECT_DESKTOP" in
                none)
                  test ! -x /usr/bin/Xkasmvnc
                  test ! -x /opt/selkies-venv/bin/python
                  test ! -e /etc/supervisor/conf.d/vnc.conf
                  test ! -e /etc/supervisor/conf.d/desktop.conf
                  ;;
                kasmvnc)
                  test -x /usr/bin/Xkasmvnc
                  test -f /etc/supervisor/conf.d/vnc.conf
                  test ! -x /opt/selkies-venv/bin/python
                  test ! -e /etc/supervisor/conf.d/desktop.conf
                  ;;
                selkies)
                  test -x /opt/selkies-venv/bin/python
                  test -f /etc/supervisor/conf.d/desktop.conf
                  test ! -x /usr/bin/Xkasmvnc
                  test ! -e /etc/supervisor/conf.d/vnc.conf
                  ;;
                both)
                  test -x /usr/bin/Xkasmvnc
                  test -x /opt/selkies-venv/bin/python
                  test -f /etc/supervisor/conf.d/vnc.conf
                  test -f /etc/supervisor/conf.d/desktop.conf
                  ;;
              esac

              if [ "$EXPECT_EDITOR" = code-server ]; then
                command -v code-server >/dev/null
                test -f /etc/supervisor/conf.d/code-server.conf
              else
                ! command -v code-server >/dev/null
                test ! -e /etc/supervisor/conf.d/code-server.conf
              fi
              if [ "$EXPECT_DEV_RUNTIMES" = standard ]; then
                for tool in mise java node python pnpm; do command -v "$tool" >/dev/null; done
              else
                ! command -v mise >/dev/null
              fi
              if [ "$EXPECT_DESKTOP_APPS" = firefox ]; then
                command -v firefox-esr >/dev/null
              else
                ! command -v firefox-esr >/dev/null
              fi
              if [ "$EXPECT_PENTEST" = bootstrap ]; then
                command -v debootstrap >/dev/null
              else
                ! command -v debootstrap >/dev/null
              fi
              if [ "$EXPECT_BACKUP_TRANSFER" = standard ]; then
                command -v restic >/dev/null
                command -v croc >/dev/null
                test -f /etc/supervisor/conf.d/backup-watcher.conf
              else
                ! command -v restic >/dev/null
                ! command -v croc >/dev/null
                test ! -e /etc/supervisor/conf.d/backup-watcher.conf
              fi
            '

      - name: Boot the selected image
        shell: bash
        env:
          IMAGE: ${{ needs.validate.outputs.image_name }}
          EXPECT_DESKTOP: ${{ inputs.desktop }}
          EXPECT_EDITOR: ${{ inputs.editor }}
        run: |
          set -euo pipefail
          container="sdw-package-check-${{ matrix.arch }}"
          # shellcheck disable=SC2329 # invoked by trap
          finish() {
            local rc="$?"
            trap - EXIT
            if [ "$rc" -ne 0 ] && docker inspect "$container" >/dev/null 2>&1; then
              echo '--- container logs ---' >&2
              docker logs "$container" >&2 || true
              echo '--- vault diagnostics ---' >&2
              docker exec "$container" sh -c '
                id
                ls -ld /dev/fuse /workspace /vault/cipher 2>&1 || true
                mountpoint /workspace 2>&1 || true
                mount | grep -E "(/workspace|fuse)" || true
                gocryptfs -version 2>&1 || true
                grep fuse /proc/filesystems 2>&1 || true
              ' >&2 || true
            fi
            docker rm -f "$container" >/dev/null 2>&1 || true
            exit "$rc"
          }
          wait_port() {
            local port="$1"
            for _ in $(seq 1 60); do
              if docker exec "$container" nc -z 127.0.0.1 "$port" >/dev/null 2>&1; then
                return 0
              fi
              sleep 2
            done
            echo "Port $port did not open" >&2
            docker logs "$container"
            return 1
          }
          assert_closed() {
            local port="$1"
            if docker exec "$container" nc -z 127.0.0.1 "$port" >/dev/null 2>&1; then
              echo "Unexpected service on port $port" >&2
              return 1
            fi
          }
          trap finish EXIT
          trap 'exit 130' INT TERM HUP
          docker run -d --name "$container" --privileged --device /dev/fuse \
            --security-opt apparmor=unconfined \
            -e PASSWORD=ci-profile-check \
            -e CLASH_SUBSCRIPTION_URL=http://127.0.0.1:9/sub \
            -e EGRESS_ENFORCE=0 \
            "$IMAGE" >/dev/null

          healthy=
          for _ in $(seq 1 90); do
            state="$(docker inspect --format '{{.State.Status}} {{if .State.Health}}{{.State.Health.Status}}{{end}}' "$container")"
            case "$state" in
              'running healthy') healthy=1; break ;;
              exited*) docker logs "$container"; exit 1 ;;
            esac
            sleep 2
          done
          if [ -z "$healthy" ]; then
            docker logs "$container"
            echo 'Image did not become healthy within 180 seconds' >&2
            exit 1
          fi

          docker exec "$container" curl -fsS http://127.0.0.1:8080/auth/login >/dev/null
          docker exec "$container" mountpoint -q /workspace
          test "$(docker exec "$container" stat -c '%u:%g' /workspace/home)" = 1000:1000
          test "$(docker exec "$container" stat -c '%u:%g' /workspace/home/.config)" = 1000:1000

          if [ "$EXPECT_EDITOR" = code-server ]; then wait_port 8082; else assert_closed 8082; fi
          case "$EXPECT_DESKTOP" in
            none) assert_closed 6080; assert_closed 6081 ;;
            kasmvnc) assert_closed 6080; wait_port 6081 ;;
            selkies) wait_port 6080; assert_closed 6081 ;;
            both) wait_port 6080; wait_port 6081 ;;
          esac

      - name: Export compressed Docker image
        id: archive
        shell: bash
        env:
          IMAGE: ${{ needs.validate.outputs.image_name }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p dist
          archive="${IMAGE}-linux-${ARCH}.tar"
          docker save -o "dist/$archive" "$IMAGE"
          if command -v pigz >/dev/null 2>&1; then
            pigz -6 "dist/$archive"
          else
            gzip -6 "dist/$archive"
          fi
          tar -tzf "dist/$archive.gz" >/dev/null
          size="$(du -h "dist/$archive.gz" | cut -f1)"
          digest="$(sha256sum "dist/$archive.gz" | cut -d' ' -f1)"
          echo "file=$archive.gz" >> "$GITHUB_OUTPUT"
          echo "- \`$archive.gz\` — $size — SHA-256 \`$digest\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the architecture package
        if: inputs.upload_artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ needs.validate.outputs.image_name }}-linux-${{ matrix.arch }}
          path: dist/${{ steps.archive.outputs.file }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
