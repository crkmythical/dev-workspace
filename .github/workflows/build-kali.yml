name: 构建镜像 — Kali

on:
  workflow_dispatch:
    inputs:
      desktop:
        description: 桌面套件
        type: choice
        options: [kasmvnc, selkies, both, none]
        default: kasmvnc
      editor:
        description: 浏览器编辑器
        type: choice
        options: [code-server, none]
        default: code-server
      dev_runtimes:
        description: 开发环境（Java、Node、pnpm、Python）
        type: choice
        options: [standard, none]
        default: standard
      desktop_apps:
        description: 预装桌面应用
        type: choice
        options: [firefox, none]
        default: firefox
      pentest:
        description: 加密渗透测试环境初始化支持
        type: choice
        options: [bootstrap, none]
        default: bootstrap
      backup_transfer:
        description: 备份与传输（restic、croc）
        type: choice
        options: [standard, none]
        default: standard
  push:
    tags: ['v*']

# v* tag 发布两个架构包；手动运行只保留两个短期 Actions artifacts。
permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build-image.yml
    with:
      base: kali
      desktop: ${{ inputs.desktop || 'kasmvnc' }}
      editor: ${{ inputs.editor || 'code-server' }}
      dev_runtimes: ${{ inputs.dev_runtimes || 'standard' }}
      desktop_apps: ${{ inputs.desktop_apps || 'firefox' }}
      pentest: ${{ inputs.pentest || 'bootstrap' }}
      backup_transfer: ${{ inputs.backup_transfer || 'standard' }}

  release:
    name: 发布两个架构包
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      IMAGE: dev-workspace-kali-kasmvnc
    steps:
      - name: 下载两个架构包
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dev-workspace-kali-kasmvnc-linux-*
          path: dist
          merge-multiple: true

      - name: 校验并发布
        shell: bash
        run: |
          set -euo pipefail
          test -f "dist/${IMAGE}-linux-amd64.tar.gz"
          test -f "dist/${IMAGE}-linux-arm64.tar.gz"
          test "$(find dist -type f | wc -l | tr -d ' ')" -eq 2
          tar -tzf "dist/${IMAGE}-linux-amd64.tar.gz" >/dev/null
          tar -tzf "dist/${IMAGE}-linux-arm64.tar.gz" >/dev/null
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME" \
            "dist/${IMAGE}-linux-amd64.tar.gz" \
            "dist/${IMAGE}-linux-arm64.tar.gz"
