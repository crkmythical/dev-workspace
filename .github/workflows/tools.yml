name: Tool pins

# The third-party tools baked into the image (caddy, restic, croc, mihomo, code-server, KasmVNC, Selkies,
# mise, IDEA, Burp Suite) are pinned, with checksums, in src/image/tools/*.env (Selkies' Python
# dependencies, with the hash of every allowed file, in src/image/tools/selkies-requirements.txt).
# This reports when a pin is behind its project's latest release; `make update-tools` moves them,
# and the diff is reviewed like any other dependency bump.
on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: Are the pinned tools current?
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: deploy/scripts/update-tools.sh --check
