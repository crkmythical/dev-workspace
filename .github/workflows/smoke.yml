name: Smoke test

# Builds the image, boots it next to a fake upstream and runs tests/smoke against it (see
# tests/smoke/README.md). It takes a while, so it is not part of ordinary CI: it runs by hand and on
# pull requests that touch the image, Compose files, image code or the smoke suite. Image packaging
# performs only a fast structural check and leaves this full privileged/browser suite independent.
on:
  workflow_dispatch:
    inputs:
      variant:
        description: Which image to build and test
        type: choice
        options: [default, full]
        default: default
  workflow_call:
    inputs:
      variant:
        description: Which image to build and test (default or full)
        type: string
        default: default
  pull_request:
    paths:
      - 'src/image/**'
      - 'src/rust/**'
      - 'src/tests/smoke/**'
      - 'deploy/scripts/**'
      - 'deploy/client/**'
      - 'docker-compose*.yml'
      - '.github/workflows/smoke.yml'

concurrency:
  group: smoke-${{ github.workflow }}-${{ github.ref }}-${{ inputs.variant || 'default' }}
  # A newer push to a pull request supersedes the older run; a release gate is never cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Keep successful smoke runs artifact-free; Docker's build record is diagnostic metadata, not an image.
  DOCKER_BUILD_RECORD_UPLOAD: 'false'

jobs:
  smoke:
    name: smoke (${{ matrix.variant }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # A pull request tests the default image; a manual run or a caller picks one.
        variant: ${{ fromJSON(format('["{0}"]', inputs.variant || 'default')) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android \
            /opt/ghc /usr/local/share/boost /opt/hostedtoolcache
          sudo apt-get clean
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./src
          file: ./src/image/Dockerfile
          load: true
          tags: dev-workspace:smoke
          build-args: |
            BASE_IMAGE=kalilinux/kali-rolling
            DESKTOP_STACK=${{ matrix.variant == 'full' && 'both' || 'kasmvnc' }}
          cache-from: type=gha,scope=smoke-${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=smoke-${{ matrix.variant }}

      # checks/30-sync.sh runs the native Rust protocol probe on the host. The browser check uses
      # the runner's Node only as a Playwright driver for real Chrome; no product code is JavaScript.
      # Screenshots are retained only when this independent full smoke workflow fails.
      - name: Smoke test
        uses: ./.github/actions/run-smoke
        with:
          image: dev-workspace:smoke
          artifact-name: smoke-shots-${{ matrix.variant }}
