name: Smoke test

# Builds the image, boots it next to a fake upstream and runs tests/smoke against it (see
# tests/smoke/README.md). It takes a while, so it is not part of CI: it runs by hand and on pull
# requests that touch the image, the compose files, the code that ends up in the image or the
# smoke test itself. The release build (build-image.yml) does its own per-architecture build and
# smoke of the immutable candidate and shares the smoke steps with this workflow through
# .github/actions/run-smoke; it publishes nothing unless every candidate passes.
on:
  workflow_dispatch:
    inputs:
      variant:
        description: Which image to build and test
        type: choice
        options: [default, full]
        default: default
  workflow_call:
    inputs:
      variant:
        description: Which image to build and test (default or full)
        type: string
        default: default
  pull_request:
    paths:
      - 'src/image/**'
      - 'src/rust/**'
      - 'src/tests/smoke/**'
      - 'deploy/scripts/**'
      - 'deploy/client/**'
      - 'docker-compose*.yml'
      - '.github/workflows/smoke.yml'

concurrency:
  group: smoke-${{ github.workflow }}-${{ github.ref }}-${{ inputs.variant || 'default' }}
  # A newer push to a pull request supersedes the older run; a release gate is never cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  smoke:
    name: smoke (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # A pull request tests the default image; a manual run or a caller picks one.
        variant: ${{ fromJSON(format('["{0}"]', inputs.variant || 'default')) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android \
            /opt/ghc /usr/local/share/boost /opt/hostedtoolcache
          sudo apt-get clean
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build the image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./src
          file: ./src/image/Dockerfile
          load: true
          tags: dev-workspace:smoke
          build-args: |
            BASE_IMAGE=kalilinux/kali-rolling
            DESKTOP_STACK=${{ matrix.variant == 'full' && 'both' || 'kasmvnc' }}
          cache-from: type=gha,scope=smoke-${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=smoke-${{ matrix.variant }}

      # checks/30-sync.sh runs the native Rust protocol probe on the host. The browser check uses
      # the runner's Node only as a Playwright driver for real Chrome; no product code is JavaScript.
      # The Rust set-up, the smoke run, the screenshots and the failure dump are shared with the
      # release build through .github/actions/run-smoke, so the two stay in step.
      - name: Smoke test
        uses: ./.github/actions/run-smoke
        with:
          image: dev-workspace:smoke
          artifact-name: smoke-shots-${{ matrix.variant }}
