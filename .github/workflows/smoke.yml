name: Smoke test

# Builds the image, boots it next to a fake upstream and runs tests/smoke against it (see
# tests/smoke/README.md). It takes a while, so it is not part of CI: it runs by hand and on pull
# requests that touch the image, the compose files, the code that ends up in the image or the
# smoke test itself. build-image.yml calls it (workflow_call) for both variants, and publishes
# nothing unless both pass.
on:
  workflow_dispatch:
    inputs:
      variant:
        description: Which image to build and test
        type: choice
        options: [default, full]
        default: default
  workflow_call:
    inputs:
      variant:
        description: Which image to build and test (default or full)
        type: string
        default: default
  pull_request:
    paths:
      - 'src/image/**'
      - 'src/rust/**'
      - 'src/tests/smoke/**'
      - 'deploy/scripts/**'
      - 'deploy/client/**'
      - 'docker-compose*.yml'
      - '.github/workflows/smoke.yml'

concurrency:
  group: smoke-${{ github.workflow }}-${{ github.ref }}-${{ inputs.variant || 'default' }}
  # A newer push to a pull request supersedes the older run; a release gate is never cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  smoke:
    name: smoke (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # A pull request tests the default image; a manual run or a caller picks one.
        variant: ${{ fromJSON(format('["{0}"]', inputs.variant || 'default')) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android \
            /opt/ghc /usr/local/share/boost /opt/hostedtoolcache
          sudo apt-get clean
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./src
          file: ./src/image/Dockerfile
          load: true
          tags: dev-workspace:smoke
          build-args: |
            BASE_IMAGE=kalilinux/kali-rolling
            DESKTOP_STACK=${{ matrix.variant == 'full' && 'both' || 'kasmvnc' }}
          cache-from: type=gha,scope=smoke-${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=smoke-${{ matrix.variant }}

      # checks/30-sync.sh runs the native Rust protocol probe on the host. The browser check uses
      # the runner's Node only as a Playwright driver for real Chrome; no product code is JavaScript.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: Cache Rust
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src/rust
      - name: Smoke test
        env:
          SMOKE_SHOTS_DIR: ${{ github.workspace }}/smoke-shots
        run: src/tests/smoke/run.sh --image dev-workspace:smoke --services

      - name: Screenshots of the desktops
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: smoke-shots-${{ matrix.variant }}
          path: smoke-shots
          if-no-files-found: ignore

      - name: Containers, if it failed
        if: failure()
        run: |
          docker ps -a
          for c in $(docker ps -aq); do echo "::group::$(docker inspect -f '{{.Name}}' "$c")"; docker logs --tail 80 "$c" 2>&1 || true; echo "::endgroup::"; done
