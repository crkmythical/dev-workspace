name: Run smoke
description: >-
  Smoke-test an already-built workspace image for the standalone smoke workflow.
  SMOKE_HOSTED_RUNNER is set here: a GitHub-hosted runner cannot release a FUSE mount or enforce
  ptrace isolation, so the handful of checks that need those report SKIP instead of FAIL (they run
  in full locally and on a privileged self-hosted/VM runner, where the variable is unset).

inputs:
  image:
    description: Image reference to test.
    required: true
  pull:
    description: docker pull the image before testing (for a pushed release candidate).
    required: false
    default: 'false'
  require-browser:
    description: Fail rather than skip when the real-Chrome browser check cannot run.
    required: false
    default: 'false'
  artifact-name:
    description: Name of the uploaded desktop-screenshots artifact.
    required: true

runs:
  using: composite
  steps:
    - name: Set up Rust smoke client
      uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      with:
        toolchain: stable
    - name: Cache Rust smoke client
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      with:
        workspaces: src/rust

    - name: Pull candidate
      if: inputs.pull == 'true'
      shell: bash
      run: docker pull "${{ inputs.image }}"

    - name: Ensure a browser for the smoke gate
      shell: bash
      run: |
        if [ -x /usr/bin/google-chrome ] || [ -x /usr/bin/google-chrome-stable ] \
          || [ -x /usr/bin/chromium ] || [ -x /usr/bin/chromium-browser ]; then
          echo "a system browser is already present; the smoke test will use it"
          exit 0
        fi
        # GitHub's arm64 Linux runners ship no Chrome (Google builds none for linux-arm64). Fetch
        # Playwright's Chromium, which it does build for arm64, and point the driver at it with
        # CHROME_PATH. playwright-core alone never downloads a browser, so the matching full
        # playwright CLI installs it into the cache that playwright-core.executablePath() resolves.
        cd src/tests/smoke/browser
        npm ci --ignore-scripts --no-audit --no-fund
        ver="$(node -p "require('playwright-core/package.json').version")"
        npx -y "playwright@${ver}" install --with-deps chromium
        chrome="$(node -e 'console.log(require("playwright-core").chromium.executablePath())')"
        test -x "$chrome"
        echo "CHROME_PATH=$chrome" >>"$GITHUB_ENV"
        echo "using Playwright Chromium at $chrome"

    - name: Smoke
      shell: bash
      env:
        SMOKE_SHOTS_DIR: ${{ github.workspace }}/smoke-shots
        SMOKE_HOSTED_RUNNER: '1'
        SMOKE_REQUIRE_BROWSER: ${{ inputs.require-browser == 'true' && '1' || '' }}
      run: src/tests/smoke/run.sh --image "${{ inputs.image }}" --services

    - name: Desktop screenshots on failure
      if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.artifact-name }}
        path: smoke-shots
        if-no-files-found: ignore

    - name: Containers, if smoke failed
      if: failure()
      shell: bash
      run: |
        docker ps -a
        for c in $(docker ps -aq); do
          echo "::group::$(docker inspect -f '{{.Name}}' "$c")"
          docker logs --tail 80 "$c" 2>&1 || true
          echo "::endgroup::"
        done
