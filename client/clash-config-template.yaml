# Clash client-only configuration template
# This container provides a local proxy without the full dev workspace.

port: 7890
socks-port: 7891
allow-lan: true
bind-address: "0.0.0.0"
mode: rule
log-level: info

# External controller (optional, for dashboard)
external-controller: "127.0.0.1:9090"

dns:
  enable: true
  enhanced-mode: fake-ip
  nameserver:
    - https://dns.cloudflare.com/dns-query
    - https://dns.google/dns-query
  fallback:
    - https://1.0.0.1/dns-query

# Proxy providers — populated from subscription URL at runtime
proxy-providers:
  subscription:
    type: http
    url: "${CLASH_SUBSCRIPTION_URL}"
    interval: 3600
    path: ./providers/subscription.yaml
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: 300

rules:
  - DOMAIN-SUFFIX,local,DIRECT
  - IP-CIDR,127.0.0.0/8,DIRECT
  - IP-CIDR,172.16.0.0/12,DIRECT
  - IP-CIDR,10.0.0.0/8,DIRECT
  - IP-CIDR,192.168.0.0/16,DIRECT
  - MATCH,DIRECT
