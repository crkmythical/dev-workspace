<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sync — Secure Dev Workspace</title>
  <style>
    :root { --bg:#1e1e2e; --surface:#2a2a3c; --text:#cdd6f4; --muted:#a6adc8; --accent:#89b4fa; --ok:#a6e3a1; --warn:#f9e2af; --err:#f38ba8; --border:#45475a; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:var(--bg); color:var(--text); line-height:1.5; min-height:100vh; }
    #app { max-width:640px; margin:0 auto; padding:2rem 1rem; }
    h1 { font-size:1.25rem; font-weight:600; margin-bottom:1.5rem; color:var(--accent); }
    .status { display:inline-flex; align-items:center; gap:.5rem; padding:.375rem .75rem; border-radius:6px; font-size:.8125rem; background:var(--surface); border:1px solid var(--border); margin-bottom:1rem; }
    .dot { width:8px; height:8px; border-radius:50%; }
    .dot.ok { background:var(--ok); } .dot.sync { background:var(--accent); animation:pulse 1s infinite; } .dot.err { background:var(--err); } .dot.warn { background:var(--warn); }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
    button { padding:.5rem 1rem; border:1px solid var(--border); border-radius:6px; background:var(--surface); color:var(--text); font-size:.8125rem; cursor:pointer; }
    button:hover { background:var(--border); border-color:var(--accent); }
    .btns { display:flex; flex-wrap:wrap; gap:.5rem; margin-bottom:1.5rem; }
    .section { margin-bottom:1.5rem; }
    .section-title { font-size:.75rem; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin-bottom:.5rem; }
    .log { font-size:.75rem; padding:.25rem 0; border-bottom:1px solid var(--border); color:var(--muted); }
    .drop { border:2px dashed var(--border); border-radius:8px; padding:2rem; text-align:center; color:var(--muted); }
    .drop.active { border-color:var(--accent); color:var(--accent); }
    .hidden { display:none; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
