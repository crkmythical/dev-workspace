[package]
name = "sync-service"
version = "0.1.0"
edition = "2021"
publish = false
description = "Rust/Axum PoC of the sync-service — wire-compatible with the TS implementation"

[lib]
path = "src/lib.rs"

[[bin]]
name = "sync-service"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
hex = "0.4"
serde_json = "1"
