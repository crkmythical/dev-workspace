[package]
name = "sync-service"
version = "0.1.0"
edition = "2021"
publish = false
description = "Rust/Axum sync-service — wire- and HTTP-compatible with the TS implementation it replaces"

[lib]
path = "src/lib.rs"

# Lib-only: the daemon runs as `sdw sync-service` (cli calls run_blocking), so there is no separate
# binary in the image. The integration tests here still exercise the lib directly.

[dependencies]
sdw-core = { path = "../core" }
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22.1"
bcrypt = "0.15"

[dev-dependencies]
hex = "0.4"
serde_json = "1"
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
