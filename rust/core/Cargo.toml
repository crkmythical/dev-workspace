[package]
name = "sdw-core"
version = "0.1.0"
edition = "2021"
publish = false
description = "Pure domain logic and use cases (a Rust port of packages/core); no I/O, no runtime deps"

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
proptest = "1"
