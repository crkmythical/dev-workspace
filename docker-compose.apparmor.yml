# Opt-in override for Linux hosts that run AppArmor (Ubuntu, Debian, ...).
#
# Docker's default AppArmor profile forbids mount(2), so gocryptfs cannot mount the vault:
# the workspace starts with the vault LOCKED and "fusermount3: mount failed: Permission denied".
# Docker Desktop (macOS, Windows) has no AppArmor and does not need this file.
#
#   docker compose -f docker-compose.yml -f docker-compose.apparmor.yml up -d
#
# It removes the last confinement layer the container still has (it already runs with
# SYS_ADMIN and an unconfined seccomp profile), so treat the container as a weak boundary.
# See deploy/docs/threat-model.md.
services:
  workspace:
    security_opt:
      - apparmor:unconfined
