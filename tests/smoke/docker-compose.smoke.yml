# Smoke-test override for ../../docker-compose.yml (see README.md in this directory).
#
# The workspace service stays exactly what docker-compose.yml defines (devices, caps, volumes,
# build args, healthcheck inherited from the image); this file only
#   - takes the image from SMOKE_IMAGE,
#   - replaces env_file, so the repository's own .env is never read,
#   - gives the container, the network and the published port names of their own, so a smoke run
#     can sit beside a real workspace on the same Docker host without touching it,
#   - adds the fake upstream (subscription provider + proxy node) at a fixed address, because Clash
#     resolves names with its own DNS and cannot see Docker's.
#
# Needs Docker Compose >= 2.24 (`!override`).
networks:
  default:
    ipam:
      config:
        - subnet: ${SMOKE_SUBNET:-172.30.77.0/24}

services:
  upstream:
    image: python:3.12-alpine
    container_name: ${SMOKE_PROJECT:-sdw-smoke}-upstream
    command: ["python3", "-u", "/srv/fake_upstream.py"]
    environment:
      UPSTREAM_IP: ${SMOKE_UPSTREAM_IP:-172.30.77.10}
      SS_NODE_IP: ${SMOKE_SS_NODE_IP:-}
      SS_PASSWORD: ${SMOKE_SS_PASSWORD:-smoke-ss-password}
    volumes:
      - ./tests/smoke/fixtures/fake_upstream.py:/srv/fake_upstream.py:ro
    networks:
      default:
        ipv4_address: ${SMOKE_UPSTREAM_IP:-172.30.77.10}

  workspace:
    image: ${SMOKE_IMAGE:-dev-workspace:smoke}
    container_name: ${SMOKE_PROJECT:-sdw-smoke}-workspace
    env_file: !override
      - tests/smoke/smoke.env
      - ${SMOKE_EXTRA_ENV:-tests/smoke/empty.env}
    environment:
      CLASH_SUBSCRIPTION_URL: http://${SMOKE_UPSTREAM_IP:-172.30.77.10}:8000/${SMOKE_SUB:-sub.yaml}
      TUNNEL_HOST_PORT: ${SMOKE_PORT:-18090}
    depends_on:
      - upstream
