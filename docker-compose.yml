x-workspace: &workspace-base
  dns:
    - 1.1.1.1
    - 8.8.8.8
  # Least privilege: drop Docker's full default capability set and add back only what the workspace
  # uses, verified against the smoke suite. The dropped ones (SETFCAP, SETPCAP, AUDIT_WRITE) are
  # privesc-relevant and unused at runtime — the only `setcap` is at image-build time, and nothing
  # manipulates capabilities while running. SYS_ADMIN (FUSE) remains the dominant risk; a non-root
  # user plus a microVM (Firecracker/Kata) is the real isolation fix (see deploy/docs/threat-model.md).
  cap_drop:
    - ALL
  cap_add:
    - SYS_ADMIN        # gocryptfs / FUSE mount
    - NET_ADMIN        # nftables egress firewall (EGRESS_ENFORCE) + Clash
    - CHOWN            # entrypoint chowns /etc/clash to the clash uid; apt/dpkg; desktop-install
    - DAC_OVERRIDE     # root reads/writes across file modes (apt, tooling)
    - FOWNER           # dpkg/apt operate on files they do not own
    - FSETID           # dpkg preserves setuid/setgid bits on install
    - SETUID           # run Clash as the clash uid (setpriv); debootstrap/apt drop to _apt
    - SETGID           # same
    - KILL             # lock-vault / unmount kill mount holders (incl. the non-root clash uid)
    - NET_BIND_SERVICE # Clash's DNS listener on :53
    - SYS_CHROOT       # pentest enters its rootfs (chroot)
    - MKNOD            # debootstrap / pentest rootfs device nodes
    - NET_RAW          # pentest tools (nmap, ping)
  security_opt:
    # Required for XFCE desktop (glycin/bwrap sandbox needs pivot_root)
    - seccomp:unconfined
  devices:
    - "/dev/fuse"
  volumes:
    - vault-data:/vault/cipher
    - cache-data:/pentest/cipher
    - clash-config:/etc/clash
    - destruct-state:/var/run/self-destruct
  ports:
    - "127.0.0.1:${TUNNEL_HOST_PORT:-18080}:8080"
  restart: unless-stopped
  mem_reservation: ${MEMORY_RESERVATION:-8g}
  env_file: .env
  environment:
    - DESKTOP_RESOLUTION=${DESKTOP_RESOLUTION:-1920x1080}
    - DESKTOP_AUDIO=${DESKTOP_AUDIO:-0}
  ulimits:
    core: 0
    nofile:
      soft: 65536
      hard: 65536
  logging:
    driver: local
    options:
      max-size: "10m"
      max-file: "3"

services:
  workspace:
    <<: *workspace-base
    image: dev-workspace:${WORKSPACE_VARIANT:-trixie}
    build:
      context: ./src
      dockerfile: image/Dockerfile
      args:
        BASE_IMAGE: ${BASE_IMAGE:-debian:trixie-slim}
        DESKTOP_STACK: ${DESKTOP_STACK:-kasmvnc}
        APT_MIRROR: ${APT_MIRROR:-mirrors.aliyun.com}
        KALI_MIRROR: ${KALI_MIRROR:-http.kali.org}
    container_name: dev-workspace

volumes:
  vault-data:
  cache-data:
  clash-config:
  destruct-state:
