x-workspace: &workspace-base
  dns:
    - 1.1.1.1
    - 8.8.8.8
  cap_add:
    - SYS_ADMIN
  security_opt:
    # Required for XFCE desktop (glycin/bwrap sandbox needs pivot_root)
    - seccomp:unconfined
  devices:
    - "/dev/fuse"
  volumes:
    - vault-data:/vault/cipher
    - cache-data:/pentest/cipher
    - clash-config:/etc/clash
    - destruct-state:/var/run/self-destruct
  ports:
    - "127.0.0.1:${TUNNEL_HOST_PORT:-18080}:8080"
  restart: unless-stopped
  mem_reservation: ${MEMORY_RESERVATION:-8g}
  env_file: .env
  environment:
    - DESKTOP_RESOLUTION=${DESKTOP_RESOLUTION:-1920x1080}
    - DESKTOP_AUDIO=${DESKTOP_AUDIO:-0}
  ulimits:
    core: 0
    nofile:
      soft: 65536
      hard: 65536
  logging:
    driver: local
    options:
      max-size: "10m"
      max-file: "3"

services:
  workspace:
    <<: *workspace-base
    image: dev-workspace:${WORKSPACE_VARIANT:-trixie}
    build:
      context: .
      dockerfile: image/Dockerfile
      args:
        BASE_IMAGE: ${BASE_IMAGE:-debian:trixie-slim}
        DESKTOP_STACK: ${DESKTOP_STACK:-both}
    container_name: dev-workspace

volumes:
  vault-data:
  cache-data:
  clash-config:
  destruct-state:
