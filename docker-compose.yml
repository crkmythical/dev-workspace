x-workspace: &workspace-base
  dns:
    - 1.1.1.1
    - 8.8.8.8
  # Least privilege: drop Docker's full default capability set and add back only what the workspace
  # uses, verified against the smoke suite. The dropped ones (SETFCAP, SETPCAP, AUDIT_WRITE) are
  # privesc-relevant and unused at runtime — the only `setcap` is at image-build time, and nothing
  # manipulates capabilities while running. SYS_ADMIN (FUSE) remains the dominant risk; a non-root
  # user plus a microVM (Firecracker/Kata) is the real isolation fix (see deploy/docs/threat-model.md).
  cap_drop:
    - ALL
  # SYS_CHROOT, MKNOD and NET_RAW (the pentest plugin's rootfs and raw-socket tools) are NOT here:
  # docker-compose.pentest.yml adds them, together with the direct network access they need.
  cap_add:
    - SYS_ADMIN        # gocryptfs / FUSE mount
    - NET_ADMIN        # the nftables egress firewall (EGRESS_ENFORCE, on by default) + Clash
    - CHOWN            # entrypoint chowns /etc/clash to the clash uid; apt/dpkg; desktop-install
    - DAC_OVERRIDE     # root reads/writes across file modes (apt, tooling)
    - FOWNER           # dpkg/apt operate on files they do not own
    - FSETID           # dpkg preserves setuid/setgid bits on install
    - SETUID           # run Clash and the workload as their uids (setpriv); apt drops to _apt
    - SETGID           # same
    - KILL             # lock-vault / unmount kill mount holders (incl. the non-root clash uid)
    - NET_BIND_SERVICE # Clash's DNS listener on :53
  security_opt:
    # Required for XFCE desktop (glycin/bwrap sandbox needs pivot_root)
    - seccomp:unconfined
  devices:
    - "/dev/fuse"
  volumes:
    - vault-data:/vault/cipher
    - cache-data:/pentest/cipher
    - clash-config:/etc/clash
    - destruct-state:/var/run/self-destruct
    # The audit trail (who logged in or tried to, self-destruct calls, egress changes): kept across
    # a container re-creation; `docker compose down -v` (destroy.sh) removes it with the rest.
    - audit-data:/var/log/sdw
  ports:
    - "127.0.0.1:${TUNNEL_HOST_PORT:-18080}:8080"
  restart: unless-stopped
  mem_reservation: ${MEMORY_RESERVATION:-8g}
  # Hard caps so one instance cannot exhaust the host — important when running several ephemeral
  # instances on one host (up.sh). Defaults keep single-instance behaviour unchanged:
  #   MEMORY_LIMIT / CPU_LIMIT = 0 → no limit (set per instance for batch, e.g. 4g / 2)
  #   PIDS_LIMIT = 4096 → a fork-bomb guard that normal use never reaches (-1 to disable)
  mem_limit: ${MEMORY_LIMIT:-0}
  cpus: ${CPU_LIMIT:-0}
  pids_limit: ${PIDS_LIMIT:-4096}
  env_file: .env
  environment:
    - DESKTOP_RESOLUTION=${DESKTOP_RESOLUTION:-1920x1080}
    - DESKTOP_AUDIO=${DESKTOP_AUDIO:-0}
    # Cloudflare Access single-sign-on (empty = off). The orchestration (deploy/orchestration/up.sh)
    # injects these from the provisioned Access app so the workspace gate accepts the edge session;
    # empty by default so a plain `docker compose up` is unaffected.
    - ACCESS_TEAM_DOMAIN=${ACCESS_TEAM_DOMAIN:-}
    - ACCESS_AUD=${ACCESS_AUD:-}
  ulimits:
    core: 0
    nofile:
      soft: 65536
      hard: 65536
  logging:
    driver: local
    options:
      max-size: "10m"
      max-file: "3"

services:
  workspace:
    <<: *workspace-base
    image: dev-workspace:${WORKSPACE_VARIANT:-trixie}
    build:
      context: ./src
      dockerfile: image/Dockerfile
      args:
        BASE_IMAGE: ${BASE_IMAGE:-debian:trixie-slim}
        DESKTOP_STACK: ${DESKTOP_STACK:-kasmvnc}
        APT_MIRROR: ${APT_MIRROR:-mirrors.aliyun.com}
        KALI_MIRROR: ${KALI_MIRROR:-http.kali.org}
        # Optional GitHub download mirror for the pinned tools, build-time only (empty = GitHub
        # direct). fetch-tool still verifies the pinned sha256, so the mirror cannot swap in other
        # bytes. See SDW_GH_MIRROR in .env.example.
        SDW_GH_MIRROR: ${SDW_GH_MIRROR:-}
        # Outbound proxy for the BUILD only (empty = none). BuildKit treats these three as
        # predefined build args: they reach every RUN step but are not recorded in the image or
        # its history, and they do not invalidate the layer cache.
        HTTP_PROXY: ${BUILD_PROXY:-}
        HTTPS_PROXY: ${BUILD_PROXY:-}
        NO_PROXY: ${BUILD_NO_PROXY:-localhost,127.0.0.0/8}
    # Parameterised so several ephemeral instances can run on one host (up.sh sets ws-<id>);
    # defaults to dev-workspace for a plain single `docker compose up`.
    container_name: ${WORKSPACE_CONTAINER_NAME:-dev-workspace}

volumes:
  vault-data:
  cache-data:
  clash-config:
  destruct-state:
  audit-data:
